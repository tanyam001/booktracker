{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-4">Log in</h2>

            <form method="POST">
                {% csrf_token %}

                {{ form|crispy }}

                <button type="submit" class="btn btn-primary">
                    Log in
                </button>
            </form>

            <p class="mt-3">
                Don't have an account?
                <a href="{% url 'register' %}">Register</a>
            </p>

        </div>
    </div>
</div>


{% endblock content %}
