 <!-- Navigation-->
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    
    <div class="container px-4 px-lg-5 py-0">
        
        <a class="navbar-brand fw-bold fs-3 artistic-nav" href="#!">Books Tracker</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
            aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fs-5 artistic-nav">
                <li class="nav-item"><a class="nav-link" aria-current="page" href="{% url 'book_list' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
                {% comment %} <li class="nav-item"><a class="nav-link" href = "{% url 'my_books' %}">My Books</a></li> {% endcomment %}
                {% if user.is_authenticated %}


                <li class="nav-item">
                    <a class="nav-link" href="{% url 'book_add' %}">
                        Add Book
                    </a>
                </li>

                {% comment %} <li class="nav-item">
                    <a class="nav-link" href="{% url 'my_books' %}">
                        My Books
                    </a>
                </li> {% endcomment %}

                <a class="nav-link" href="{% url 'my_books' %}">
                    My Books
                </a>

                <span class="navbar-text me-3">
                    Hi, {{ user.username }}!
                </span>

                <a href="{% url 'profile' %}">
                    <img
                        src="{{ user.profile.profile_picture.url }}"
                        alt="{{ user.username }}"
                        width="40"
                        height="40"
                        class="rounded-circle"
                        style="object-fit: cover;"
                    >
                </a>

                <form method="POST" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link">
                        Log out
                    </button>
                </form>

            {% else %}

                <a class="nav-link" href="{% url 'login' %}">
                    Log in
                </a>

                <a class="nav-link" href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}
            </ul>
        </div>
    
    </div>
</nav>
